<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Laço · matchmaking do Porto Digital</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="description"
      content="Laço conecta startups do Porto Digital a investidores anjo do Nordeste por afinidade de setor, estágio e ticket."
    />
    <meta name="theme-color" content="#0f211b" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var salvo = localStorage.getItem('laco:tema');
          var escuro = salvo ? salvo === 'escuro' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (escuro) {
            document.documentElement.classList.add('dark');
          }
          document.documentElement.style.colorScheme = escuro ? 'dark' : 'light';
        } catch (erro) {
          /* tema padrao quando o storage esta bloqueado */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
