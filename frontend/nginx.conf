server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # SPA: qualquer rota que nao for arquivo cai no index.html (RNF04 / RNF08)
  location / {
    try_files $uri $uri/ /index.html;
  }

  # assets com cache longo porque o nome do bundle ja tem hash
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  gzip on;
  gzip_types text/plain text/css application/javascript application/json;
}