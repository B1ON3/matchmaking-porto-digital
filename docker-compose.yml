services:
  # ---------- banco de dados ----------
  db:
    image: postgres:16-alpine
    container_name: matchmaking-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: matchmaking
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d matchmaking']
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- api rest ----------
  backend:
    build:
      context: ./backend
    container_name: matchmaking-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/matchmaking?schema=public
      JWT_SECRET: ${JWT_SECRET:-troca-essa-chave-por-uma-de-verdade}
      JWT_EXPIRES_IN: 1d
      CORS_ORIGIN: http://localhost:3000
    ports:
      - '5000:5000'
    depends_on:
      db:
        condition: service_healthy

  # ---------- front-end spa ----------
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5000/api
    container_name: matchmaking-frontend
    restart: unless-stopped
    ports:
      - '3000:80'
    depends_on:
      - backend

volumes:
  pgdata: