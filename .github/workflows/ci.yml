name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Node + Express + Prisma)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Validar o schema do Prisma
        run: npx prisma validate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/matchmaking?schema=public

      - name: Gerar o Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/matchmaking?schema=public

      - name: Checar tipos
        run: npm run typecheck

      - name: Build
        run: npm run build

  frontend:
    name: Frontend (React + TS + Vite)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Checar tipos
        run: npm run typecheck

      - name: Build
        run: npm run build

  docker:
    name: Build das imagens
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build da imagem do backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: matchmaking-backend:ci

      - name: Build da imagem do frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: matchmaking-frontend:ci

      - name: Conferir se o compose está válido
        run: docker compose config --quiet